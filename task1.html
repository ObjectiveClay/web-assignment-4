<main class="container py-5">
  <div class="page-heading mb-4">
    <a href="index.html" class="text-decoration-none small">← Back to home</a>
    <h1 class="mt-2">Task 1 — HTML5 Validation</h1>
  </div>

  <div class="form-panel">
    <h2 class="h4 mb-1">Contact form with HTML5 validation</h2>
    <p class="text-secondary mb-4">
      Try submitting the form with empty fields or an invalid email address.
    </p>

    <form>
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input id="name" name="name" type="text"
          class="form-control" required maxlength="50"
          placeholder="Your name">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" name="email" type="email"
          class="form-control" required
          placeholder="name@example.com">
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message"
          class="form-control" rows="4" required maxlength="300"
          placeholder="Write your message (max 300 characters)"></textarea>
        <div class="form-text">Maximum 300 characters.</div>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</main>

<footer class="py-4 text-center text-secondary">
  <small>Assignment #4 · Forms and Validation</small>
</footer>
