<main class="container py-5">
  <div class="page-heading mb-4">
    <a href="index.html" class="text-decoration-none small">← Back to home</a>
    <h1 class="mt-2">Task 2 — Bootstrap Form Styling</h1>
  </div>

  <div class="form-panel">
    <h2 class="h4 mb-1">Contact us</h2>
    <p class="text-secondary mb-4">
      This version uses Bootstrap form classes and a responsive grid.
    </p>

    <form>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="name" class="form-label">Name</label>
          <input id="name" type="text" class="form-control"
            placeholder="Enter your name">
          <div class="form-text">Use your first and last name.</div>
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email address</label>
          <input id="email" type="email" class="form-control"
            placeholder="name@example.com">
          <div class="form-text">We will use this to reply.</div>
        </div>

        <div class="col-12">
          <label for="subject" class="form-label">Subject</label>
          <input id="subject" type="text" class="form-control"
            placeholder="What is your message about?">
        </div>

        <div class="col-12">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" class="form-control" rows="4"
            placeholder="Type your message here"></textarea>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary">Send message</button>
        </div>
      </div>
    </form>
  </div>
</main>

<footer class="py-4 text-center text-secondary">
  <small>Assignment #4 · Forms and Validation</small>
</footer>

</body>
